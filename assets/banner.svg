<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11130d" />
      <stop offset="50%" stop-color="#181a13" />
      <stop offset="100%" stop-color="#20231b" />
    </linearGradient>
    <linearGradient id="stringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d87738" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#e98a6d" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d87738" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d87738" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#11130d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#11130d" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bg)" rx="16" />
  <rect width="1200" height="380" fill="url(#glowLeft)" rx="16" />
  <rect width="1200" height="380" fill="url(#glowRight)" rx="16" />

  <!-- Ambient Sound Waves / Guitar Strings -->
  <g fill="none" stroke="url(#stringGrad)" stroke-width="2.5" opacity="0.65">
    <path d="M-50 140 C 250 80, 450 200, 750 140 C 950 100, 1100 180, 1250 120" />
    <path d="M-50 165 C 200 110, 500 230, 800 165 C 1000 120, 1150 210, 1250 150" stroke-width="2" opacity="0.8" />
    <path d="M-50 190 C 220 140, 520 250, 820 190 C 1020 150, 1170 230, 1250 180" stroke-width="1.5" opacity="0.5" />
    <path d="M-50 215 C 240 170, 540 270, 840 215 C 1040 180, 1190 250, 1250 210" stroke-width="1" opacity="0.35" />
  </g>

  <!-- Brand Mark Icon -->
  <g transform="translate(100, 125) scale(1.6)" filter="url(#shadow)">
    <g transform="rotate(-16 32 32)" stroke="#e98a6d" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M12 23c13-14 27 14 40 0" />
      <path d="M12 33c13-14 27 14 40 0" />
      <path d="M12 43c13-14 27 14 40 0" />
    </g>
  </g>

  <!-- Title & Slogans -->
  <g transform="translate(235, 140)">
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-weight="900" font-size="52" fill="#f4ede2" letter-spacing="2">
      野弦 <tspan fill="#e98a6d" font-weight="800">WILDSTRING</tspan>
    </text>
    <text x="3" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#a8a396" letter-spacing="4">
      AI-NATIVE SELF-HOSTED MUSIC PLAYER
    </text>
    <text x="3" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-weight="400" font-size="18" fill="#d1cbbf" letter-spacing="1">
      音乐不设限，自由有回响。 <tspan fill="#7a756b">| Music Knows No Bounds, Freedom Echoes.</tspan>
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 280)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="19" fill="#24281f" stroke="#373c30" stroke-width="1"/>
      <text x="105" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#e4ded5" text-anchor="middle">🎸 摇滚精神 · Rock Spirit</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(225, 0)">
      <rect width="220" height="38" rx="19" fill="#24281f" stroke="#373c30" stroke-width="1"/>
      <text x="110" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#e4ded5" text-anchor="middle">💿 原音串流 · Hi-Res Lossless</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(460, 0)">
      <rect width="240" height="38" rx="19" fill="#24281f" stroke="#373c30" stroke-width="1"/>
      <text x="120" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#e4ded5" text-anchor="middle">🧠 自然语言找歌 · AI Playlists</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(715, 0)">
      <rect width="240" height="38" rx="19" fill="#24281f" stroke="#373c30" stroke-width="1"/>
      <text x="120" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#e4ded5" text-anchor="middle">🔒 数据私有 · 100% Self-Hosted</text>
    </g>
  </g>
</svg>
