<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title">
  <title id="title">WildString 野弦 · Personal Sound Archive 个人声音档案</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="380" rx="20"/></clipPath>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#27231C"/>
      <stop offset=".5" stop-color="#1A1815"/>
      <stop offset="1" stop-color="#161512"/>
    </linearGradient>
    <radialGradient id="light" cx=".78" cy=".35" r=".65">
      <stop stop-color="#9C573D" stop-opacity=".36"/>
      <stop offset="1" stop-color="#9C573D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strings" x2="1" y2="0">
      <stop stop-color="#E98A6D" stop-opacity="0"/>
      <stop offset=".52" stop-color="#E98A6D" stop-opacity=".43"/>
      <stop offset=".79" stop-color="#D6A37C" stop-opacity=".7"/>
      <stop offset="1" stop-color="#D6A37C" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="vinyl" x2="1" y2="1">
