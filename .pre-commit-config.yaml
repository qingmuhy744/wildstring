repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trailing whitespace
        entry: uv run --frozen --project backend trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: ^(LICENSE|docs/research/.*\.txt)$
      - id: end-of-file-fixer
        name: end of file
        entry: uv run --frozen --project backend end-of-file-fixer
        language: system
        types: [text]
        exclude: ^(LICENSE|docs/research/.*\.txt)$
      - id: check-added-large-files
        name: large files
        entry: uv run --frozen --project backend check-added-large-files --maxkb=1024 --enforce-all
        language: system
      - id: check-json
        name: JSON syntax
        entry: uv run --frozen --project backend check-json
        language: system
        types: [json]
      - id: check-toml
        name: TOML syntax
        entry: uv run --frozen --project backend check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: YAML syntax
        entry: uv run --frozen --project backend check-yaml
        language: system
        types: [yaml]
      - id: check-merge-conflict
        name: merge conflicts
        entry: uv run --frozen --project backend check-merge-conflict
        language: system
        types: [text]
      - id: check-case-conflict
        name: filename case conflicts
        entry: uv run --frozen --project backend check-case-conflict
        language: system
      - id: detect-private-key
        name: private keys
        entry: uv run --frozen --project backend detect-private-key
        language: system
        types: [text]
      - id: debug-statements
        name: Python debug statements
        entry: uv run --frozen --project backend debug-statement-hook
        language: system
        types: [python]
      - id: ruff
        name: Ruff lint
        entry: uv run --frozen --project backend ruff check --config backend/pyproject.toml --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen --project backend ruff format --config backend/pyproject.toml
        language: system
        types: [python]
      - id: bandit
        name: Python security
        entry: uv run --frozen --project backend bandit -r backend/src scripts -ll -c backend/pyproject.toml
        language: system
        files: ^(backend/.*\.py|backend/pyproject\.toml|scripts/.*\.py)$
        pass_filenames: false
      - id: web-format
        name: Web format
        entry: npm --prefix frontend/web exec -- prettier --check
        language: system
        files: ^frontend/web/.*\.(tsx?|css|json|html)$
      - id: web-typecheck
        name: Web typecheck
        entry: npm --prefix frontend/web run typecheck
        language: system
        files: ^frontend/web/.*\.(tsx?|json)$
        pass_filenames: false
