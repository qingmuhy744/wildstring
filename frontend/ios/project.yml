name: WildString
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WildStringKit:
    path: WildStringKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.15"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WildString:
    type: application
    platform: iOS
    sources:
      - path: WildString
    dependencies:
      - package: WildStringKit
        product: CoreNetwork
      - package: WildStringKit
        product: CorePlayback
    info:
      path: WildString/Info.plist
      properties:
        CFBundleDisplayName: "野弦"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "用于连接您局域网中的野弦服务器。"
    settings:
      base:
        DEVELOPMENT_TEAM: "${WILDSTRING_DEVELOPMENT_TEAM}"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.wildstring.app
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.wildstring.app.debug
schemes:
  WildString:
    build:
      targets:
        WildString: all
    run:
      config: Debug
