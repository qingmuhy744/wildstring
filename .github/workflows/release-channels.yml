name: Sync stable channels

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
    outputs:
      outcome:
        value: ${{ jobs.channels.outputs.outcome }}
  workflow_dispatch:

jobs:
  channels:
    name: Sync stable channels
    if: inputs.release_tag != '' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    concurrency:
      group: stable-release-channels
      cancel-in-progress: false
    outputs:
      outcome: ${{ steps.report.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Find the highest published stable version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STABLE_TAG=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' \
            | python3 scripts/release_verify_scope.py --latest-stable)
          echo "STABLE_TAG=$STABLE_TAG" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Update the stable image and GitHub latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$STABLE_TAG"
          gh release edit "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --latest
      - name: Update Homebrew Tap cask
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: qingmuhy744/homebrew-tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew Tap update."
            echo "outcome=not-configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          python3 scripts/generate_homebrew_cask.py \
            --version "${STABLE_TAG#v}" \
            --checksums-file "$RUNNER_TEMP/SHA256SUMS" \
            --output "$TAP_DIR/Casks/wildstring.rb"
          git -C "$TAP_DIR" config user.name "github-actions[bot]"
          git -C "$TAP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIR" add Casks/wildstring.rb
          if git -C "$TAP_DIR" diff --cached --quiet; then
            echo "Homebrew Tap cask is already up to date."
            exit 0
          fi
          git -C "$TAP_DIR" commit -m "chore(cask): update wildstring to ${STABLE_TAG#v}"
          git -C "$TAP_DIR" push origin HEAD
      - name: Report Homebrew sync status
        id: report
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outputs.outcome || steps.sync.outcome }}
        run: |
          echo "outcome=$SYNC_OUTCOME" >> "$GITHUB_OUTPUT"
          if [ "$SYNC_OUTCOME" = failure ]; then
            echo "::warning title=Homebrew sync failed::The core release is published. Rerun this job to sync the cask."
          fi
