name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "backend/**"
      - "scripts/serve_web_tests.py"
      - "tests/fixtures/audio/**"
      - "scripts/package_android.py"
      - "scripts/smoke_android_release.py"
      - ".github/workflows/android.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: "Run full emulator regression before release"
        type: boolean
        default: true
      test_classes:
        description: "Comma-separated instrumented test classes (empty runs every class)"
        type: string
        default: ""
      test_repeat:
        description: "Run the selected classes this many times (flake reproduction)"
        type: string
        default: "1"
      test_retries:
        description: "Retries for classes that fail (0 measures the raw failure rate)"
        type: string
        default: "1"
      test_arguments:
        description: "Extra instrumentation arguments, space-separated KEY=VALUE"
        type: string
        default: ""
  workflow_call:
    secrets:
      ANDROID_DEV_KEYSTORE_BASE64:
        description: Dedicated fixed Dev signing keystore
        required: false
    inputs:
      run_emulator:
        type: boolean
        default: false
      test_classes:
        type: string
        default: ""
      test_repeat:
        type: string
        default: "1"
      test_retries:
        type: string
        default: "1"
      test_arguments:
        type: string
        default: ""
  schedule:
    # Weekly emulator regression baseline on main (Mondays 09:00 Asia/Shanghai)
    # so flaky tests surface on a known-good ref instead of during releases.
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  # Manual dispatches are flake-reproduction runs; let them run side by side.
  group: android-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      # The scheduled run doubles as the weekly emulator baseline on main.
      RUN_EMULATOR: ${{ inputs.run_emulator == true || github.event_name == 'schedule' }}
      ANDROID_TEST_CLASSES: ${{ inputs.test_classes || '' }}
      ANDROID_TEST_REPEAT: ${{ inputs.test_repeat || '1' }}
      ANDROID_TEST_RETRIES: ${{ inputs.test_retries || '1' }}
      ANDROID_TEST_ARGUMENTS: ${{ inputs.test_arguments || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
          persist-credentials: false
      # `apk` is a required check, so a pull request that does not touch Android inputs keeps
      # the job and skips only its build steps; a skipped job would stay pending forever.
      # Every other trigger (push, schedule, release reuse, manual runs) builds.
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/ci_changed_areas.py "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          else
            echo "android=true" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Skip the Android build
        if: steps.areas.outputs.android != 'true'
        run: echo "No Android, fixture, packaging or shared-input changes; the build is skipped."
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.areas.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.areas.outputs.android == 'true'
      - name: Install fixed Android SDK components
        if: steps.areas.outputs.android == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-37.0 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false
      - name: Prepare fixed Dev signing key
        id: dev-signing
        if: >-
          steps.areas.outputs.android == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, subprocess
          from pathlib import Path
          encoded = os.environ.get("ANDROID_DEV_KEYSTORE_BASE64")
          if not encoded:
              raise SystemExit("Missing ANDROID_DEV_KEYSTORE_BASE64 for trusted Dev builds")
          path = Path(os.environ["RUNNER_TEMP"]) / "wildstring-dev.keystore"
          path.touch(mode=0o600, exist_ok=False)
          path.write_bytes(base64.b64decode(encoded, validate=True))
          certificate = subprocess.run(
              ["keytool", "-exportcert", "-keystore", str(path), "-alias", "androiddebugkey", "-storepass", "android"],
              check=True, capture_output=True,
          ).stdout
          expected = Path("frontend/android/dev-signing-certificate.sha256").read_text().strip()
          if hashlib.sha256(certificate).hexdigest() != expected:
              raise SystemExit("Dev signing certificate does not match the pinned fingerprint")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"ANDROID_DEV_KEYSTORE_PATH={path}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("configured=true\n")
          PY
      - name: Keep untrusted builds validation-only
        if: steps.areas.outputs.android == 'true' && steps.dev-signing.outputs.configured != 'true'
        run: echo "Fork and Dependabot builds run checks without publishing an installable Dev APK."
      - name: Check, test and package APK
        if: steps.areas.outputs.android == 'true'
        run: make android-ci
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ env.RUN_EMULATOR == 'true' }}
        with:
          version: "0.13.1"
      - name: Build the instrumented test APK
        if: ${{ env.RUN_EMULATOR == 'true' }}
        run: ./frontend/android/gradlew -p frontend/android --console=plain :app:assembleDebugAndroidTest
      - name: Start disposable synthetic API for native integration
        if: ${{ env.RUN_EMULATOR == 'true' }}
        run: |
          uv sync --frozen --project backend
          bash scripts/ci_synthetic_api.sh start artifacts/android-synthetic-api.log
      - name: Enable emulator acceleration
        if: ${{ env.RUN_EMULATOR == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native instrumented tests (shard 1 of 2)
        if: ${{ env.RUN_EMULATOR == 'true' }}
        # A single long emulator session can lose the emulator partway through the suite on
        # memory-constrained hosts, which fails every remaining class as "not run". Each shard
        # gets a fresh emulator and runs half the discovered classes; together they still cover
        # every class exactly once.
        timeout-minutes: 40
        env:
          ANDROID_TEST_SHARD_INDEX: "0"
          ANDROID_TEST_SHARD_COUNT: "2"
          ANDROID_TEST_BEFORE_RETRY: bash scripts/ci_synthetic_api.sh restart artifacts/android-synthetic-api-retry.log
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          # The app has no Play Services dependency; avoid Pixel Launcher's
          # background ANR dialogs stealing focus during window-resize tests.
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          # Use the supported SwiftShader mode. This suite only needs GLES.
          emulator-options: &emulator-options -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # The instrumented suite asserts Chinese copy, so pin the emulator to
          # zh-CN before running it; otherwise resource lookups follow the
          # runner's default locale and every copy assertion misses.
          # android-emulator-runner runs each script line in its own shell, so
          # the post-reboot wait must stay on one line. adbd sometimes refuses
          # the root restart right after boot ("unable to connect for root").
          script: |
            adb root || { sleep 5; timeout 60 adb wait-for-device; adb root; } || { sleep 15; timeout 60 adb wait-for-device; adb root; }
            timeout 60 adb wait-for-device
            adb shell setprop persist.sys.locale zh-CN
            adb reboot
            timeout 120 adb wait-for-device
            timeout 120 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            python3 scripts/run_android_instrumented.py --arg realBackend=http://10.0.2.2:19882/ --classes=$ANDROID_TEST_CLASSES --repeat=$ANDROID_TEST_REPEAT --retries=$ANDROID_TEST_RETRIES --shard-index=$ANDROID_TEST_SHARD_INDEX --shard-count=$ANDROID_TEST_SHARD_COUNT --output artifacts/android-instrumented/shard-$ANDROID_TEST_SHARD_INDEX
      - name: Native instrumented tests (shard 2 of 2)
        if: ${{ env.RUN_EMULATOR == 'true' }}
        timeout-minutes: 40
        env:
          ANDROID_TEST_SHARD_INDEX: "1"
          ANDROID_TEST_SHARD_COUNT: "2"
          ANDROID_TEST_BEFORE_RETRY: bash scripts/ci_synthetic_api.sh restart artifacts/android-synthetic-api-retry.log
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          emulator-options: *emulator-options
          disable-animations: true
          script: |
            adb root || { sleep 5; timeout 60 adb wait-for-device; adb root; } || { sleep 15; timeout 60 adb wait-for-device; adb root; }
            timeout 60 adb wait-for-device
            adb shell setprop persist.sys.locale zh-CN
            adb reboot
            timeout 120 adb wait-for-device
            timeout 120 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            python3 scripts/run_android_instrumented.py --arg realBackend=http://10.0.2.2:19882/ --classes=$ANDROID_TEST_CLASSES --repeat=$ANDROID_TEST_REPEAT --retries=$ANDROID_TEST_RETRIES --shard-index=$ANDROID_TEST_SHARD_INDEX --shard-count=$ANDROID_TEST_SHARD_COUNT --output artifacts/android-instrumented/shard-$ANDROID_TEST_SHARD_INDEX
      - name: Stop synthetic API
        if: ${{ always() && env.RUN_EMULATOR == 'true' }}
        run: bash scripts/ci_synthetic_api.sh stop
      - name: Remove temporary Dev signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wildstring-dev.keystore"
      - name: Verify fixed Dev APK certificate
        if: steps.dev-signing.outputs.configured == 'true'
        run: |
          ACTUAL=$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs artifacts/android/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL" = "$(cat frontend/android/dev-signing-certificate.sha256)"
          cp frontend/android/dev-signing-certificate.sha256 artifacts/android/android-dev-signing-certificate.sha256
          cd artifacts/android
          sha256sum android-dev-signing-certificate.sha256 >> SHA256SUMS
      - name: Upload installable debug APK
        if: steps.dev-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wildstring-android-debug
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            artifacts/android-synthetic-api.log
            artifacts/android-synthetic-api-retry.log
            artifacts/android-instrumented/
            frontend/android/build/reports/
            frontend/android/app/build/reports/
            frontend/android/app/build/outputs/androidTest-results/
            frontend/android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 14
