name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "backend/**"
      - "scripts/serve_web_tests.py"
      - "tests/fixtures/audio/**"
      - "scripts/package_android.py"
      - "scripts/smoke_android_release.py"
      - ".github/workflows/android.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: "Run full emulator regression before release"
        type: boolean
        default: true
      test_classes:
        description: "Comma-separated instrumented test classes (empty runs every class)"
        type: string
        default: ""
      test_repeat:
        description: "Run the selected classes this many times (flake reproduction)"
        type: string
        default: "1"
      test_retries:
        description: "Retries for classes that fail (0 measures the raw failure rate)"
        type: string
        default: "1"
      test_arguments:
        description: "Extra instrumentation arguments, space-separated KEY=VALUE"
        type: string
        default: ""
  workflow_call:
    inputs:
      run_emulator:
        type: boolean
        default: false
      test_classes:
        type: string
        default: ""
      test_repeat:
        type: string
        default: "1"
      test_retries:
        type: string
        default: "1"
      test_arguments:
        type: string
        default: ""
  schedule:
    # Weekly emulator regression baseline on main (Mondays 09:00 Asia/Shanghai)
    # so flaky tests surface on a known-good ref instead of during releases.
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  # Manual dispatches are flake-reproduction runs; let them run side by side.
  group: android-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      # The scheduled run doubles as the weekly emulator baseline on main.
      RUN_EMULATOR: ${{ inputs.run_emulator == true || github.event_name == 'schedule' }}
      ANDROID_TEST_CLASSES: ${{ inputs.test_classes || '' }}
      ANDROID_TEST_REPEAT: ${{ inputs.test_repeat || '1' }}
      ANDROID_TEST_RETRIES: ${{ inputs.test_retries || '1' }}
      ANDROID_TEST_ARGUMENTS: ${{ inputs.test_arguments || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install fixed Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-37.0 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false
      - name: Check, test and package APK
        run: make android-ci
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ env.RUN_EMULATOR == 'true' }}
        with:
          version: "0.13.1"
      - name: Build the instrumented test APK
        if: ${{ env.RUN_EMULATOR == 'true' }}
        run: ./frontend/android/gradlew -p frontend/android --console=plain :app:assembleDebugAndroidTest
      - name: Start disposable synthetic API for native integration
        if: ${{ env.RUN_EMULATOR == 'true' }}
        run: |
          uv sync --frozen --project backend
          bash scripts/ci_synthetic_api.sh start artifacts/android-synthetic-api.log
      - name: Enable emulator acceleration
        if: ${{ env.RUN_EMULATOR == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native login, streaming and lyrics test
        id: emulator_regression
        if: ${{ env.RUN_EMULATOR == 'true' }}
        # Each test class runs in its own instrumentation process, so an app crash
        # only fails the class that caused it. Failed classes are retried once
        # against a restarted synthetic API; every attempt keeps its own report,
        # logcat and screenshots under artifacts/android-instrumented/.
        timeout-minutes: 45
        env:
          ANDROID_TEST_BEFORE_RETRY: bash scripts/ci_synthetic_api.sh restart artifacts/android-synthetic-api-retry.log
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          # The app has no Play Services dependency; avoid Pixel Launcher's
          # background ANR dialogs stealing focus during window-resize tests.
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disable-animations: true
          # The instrumented suite asserts Chinese copy, so pin the emulator to
          # zh-CN before running it; otherwise resource lookups follow the
          # runner's default locale and every copy assertion misses.
          # android-emulator-runner runs each script line in its own shell, so
          # the post-reboot wait must stay on one line. adbd sometimes refuses
          # the root restart right after boot ("unable to connect for root").
          script: |
            adb root || { sleep 5; timeout 60 adb wait-for-device; adb root; } || { sleep 15; timeout 60 adb wait-for-device; adb root; }
            timeout 60 adb wait-for-device
            adb shell setprop persist.sys.locale zh-CN
            adb reboot
            timeout 120 adb wait-for-device
            timeout 120 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            python3 scripts/run_android_instrumented.py --arg realBackend=http://10.0.2.2:19882/ --classes=$ANDROID_TEST_CLASSES --repeat=$ANDROID_TEST_REPEAT --retries=$ANDROID_TEST_RETRIES
      - name: Stop synthetic API
        if: ${{ always() && env.RUN_EMULATOR == 'true' }}
        run: bash scripts/ci_synthetic_api.sh stop
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wildstring-android-debug
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            artifacts/android-synthetic-api.log
            artifacts/android-synthetic-api-retry.log
            artifacts/android-instrumented/
            frontend/android/build/reports/
            frontend/android/app/build/reports/
            frontend/android/app/build/outputs/androidTest-results/
            frontend/android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 14
