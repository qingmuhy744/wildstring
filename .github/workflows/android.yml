name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "scripts/package_android.py"
      - ".github/workflows/android.yml"
      - "Makefile"
  pull_request:
    paths:
      - "frontend/android/**"
      - "scripts/package_android.py"
      - ".github/workflows/android.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          build-root-directory: frontend/android
      - name: Install fixed Android SDK components
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-36.1 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false
      - name: Check, test and package APK
        run: make android-ci
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native login, streaming and lyrics test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: make android-connected-test && adb pull /sdcard/Android/data/dev.wildstring.app.debug/files/ frontend/android/app/build/reports/device-screenshots
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wildstring-android-debug
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: |
            frontend/android/build/reports/
            frontend/android/app/build/reports/
            frontend/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
