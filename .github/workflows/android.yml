name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "backend/**"
      - "scripts/serve_web_tests.py"
      - "tests/fixtures/audio/**"
      - "scripts/package_android.py"
      - "scripts/smoke_android_release.py"
      - ".github/workflows/android.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  pull_request:
    paths:
      - "frontend/android/**"
      - "backend/**"
      - "scripts/serve_web_tests.py"
      - "tests/fixtures/audio/**"
      - "scripts/package_android.py"
      - "scripts/smoke_android_release.py"
      - ".github/workflows/android.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          build-root-directory: frontend/android
      - name: Install fixed Android SDK components
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-36.1 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false
      - name: Check, test and package APK
        run: make android-ci
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.18"
      - name: Start disposable synthetic API for native integration
        run: |
          mkdir -p artifacts
          uv sync --frozen --project backend
          WILDSTRING_WEB_TEST_PORT=19882 WILDSTRING_TEST_LARGE_LIBRARY=1 WILDSTRING_TEST_API_ONLY=1 uv run --frozen --project backend python scripts/serve_web_tests.py > artifacts/android-synthetic-api.log 2>&1 &
          echo $! > "$RUNNER_TEMP/wildstring-synthetic-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19882/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/android-synthetic-api.log
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native login, streaming and lyrics test
        timeout-minutes: 10
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: make android-connected-test ANDROID_TEST_ARGS=-Pandroid.testInstrumentationRunnerArguments.realBackend=http://10.0.2.2:19882/
      - name: Stop synthetic API
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/wildstring-synthetic-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/wildstring-synthetic-api.pid")" || true
          fi
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wildstring-android-debug
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: |
            artifacts/android-synthetic-api.log
            frontend/android/build/reports/
            frontend/android/app/build/reports/
            frontend/android/app/build/outputs/androidTest-results/
            frontend/android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 14
