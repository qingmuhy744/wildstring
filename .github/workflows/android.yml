name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/android/**"
      - "backend/**"
      - "scripts/serve_web_tests.py"
      - "tests/fixtures/audio/**"
      - "scripts/package_android.py"
      - "scripts/smoke_android_release.py"
      - ".github/workflows/android.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: frontend/android
      - name: Install fixed Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-37.0 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false
      - name: Check, test and package APK
        run: make android-ci
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Start disposable synthetic API for native integration
        run: |
          mkdir -p artifacts
          uv sync --frozen --project backend
          WILDSTRING_WEB_TEST_PORT=19882 WILDSTRING_TEST_LARGE_LIBRARY=1 WILDSTRING_TEST_API_ONLY=1 uv run --frozen --project backend python scripts/serve_web_tests.py > artifacts/android-synthetic-api.log 2>&1 &
          echo $! > "$RUNNER_TEMP/wildstring-synthetic-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19882/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/android-synthetic-api.log
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native login, streaming and lyrics test
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: make android-connected-test ANDROID_TEST_ARGS=-Pandroid.testInstrumentationRunnerArguments.realBackend=http://10.0.2.2:19882/
      - name: Stop synthetic API
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/wildstring-synthetic-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/wildstring-synthetic-api.pid")" || true
          fi
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wildstring-android-debug
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            artifacts/android-synthetic-api.log
            frontend/android/build/reports/
            frontend/android/app/build/reports/
            frontend/android/app/build/outputs/androidTest-results/
            frontend/android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 14
