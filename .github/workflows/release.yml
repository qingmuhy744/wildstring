name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_android_emulator: ${{ steps.scope.outputs.run_android_emulator }}
      run_ci_verify: ${{ steps.scope.outputs.run_ci_verify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify versions and main ancestry
        run: |
          python3 scripts/package_release.py --tag "$RELEASE_TAG" --check-only
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "docs/releases/$RELEASE_TAG.md"
          git merge-base --is-ancestor HEAD origin/main
      - name: Determine verification scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: python3 scripts/release_verify_scope.py >> "$GITHUB_OUTPUT"
      - name: Compare native build numbers with the previous release
        env:
          PREVIOUS_RELEASE: ${{ steps.scope.outputs.previous_release }}
        run: python3 scripts/package_release.py --tag "$RELEASE_TAG" --previous-tag "$PREVIOUS_RELEASE" --check-only

  verify:
    needs: source
    if: needs.source.outputs.run_ci_verify == 'true'
    uses: ./.github/workflows/ci.yml

  verify_android:
    needs: source
    uses: ./.github/workflows/android.yml
    secrets:
      ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
    with:
      run_emulator: ${{ needs.source.outputs.run_android_emulator == 'true' }}

  android:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ github.run_attempt > 1 }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-37.0 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false
      - name: Build with the release signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/wildstring-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD", "ANDROID_SIGNING_CERT_SHA256"):
              if not os.environ.get(name):
                  raise SystemExit(f"Missing release signing secret: {name}")
          path = Path(os.environ["ANDROID_KEYSTORE_PATH"])
          path.touch(mode=0o600, exist_ok=False)
          path.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          PY
          make android-release
          ACTUAL=$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs artifacts/android-release/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL" = "$ANDROID_SIGNING_CERT_SHA256"
          printf '%s\n' "$ACTUAL" > artifacts/android-release/android-signing-certificate.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the signed, optimized APK
        id: release_smoke
        # Retry once on a fresh emulator before failing the release; the
        # software-rendered CI emulator produces occasional false alarms.
        continue-on-error: true
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-options: &emulator-options -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: make android-release-smoke
      - name: Release smoke retry after flake
        if: ${{ steps.release_smoke.outcome == 'failure' }}
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-options: *emulator-options
          disable-animations: true
          script: make android-release-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wildstring-android-release
          path: artifacts/android-release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload release device evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-smoke
          path: artifacts/android-release-smoke/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    needs: source
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify Apple clients
        run: make ios-test ios-build macos-test
      - name: Build and pack a DMG
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make macos-dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wildstring-macos-dmg
          path: artifacts/WildString-macOS.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [source, verify, verify_android, android, macos]
    if: >-
      !failure() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      needs.verify_android.result == 'success' &&
      needs.android.result == 'success' &&
      needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Build and package Web
        run: |
          npm --prefix frontend/web ci
          make build-web
          python3 scripts/package_release.py --tag "$RELEASE_TAG" --output-dir artifacts/release
          npm --prefix plugins/node-runtime ci --ignore-scripts
          node scripts/build_source_runtimes.mjs
          python3 scripts/package_source_plugins.py --output-dir artifacts/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wildstring-android-release
          path: artifacts/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wildstring-macos-dmg
          path: artifacts/release
      - name: Verify APK and combine asset checksums
        working-directory: artifacts/release
        run: |
          sha256sum --check SHA256SUMS
          sha256sum -- *.apk *.zip *.dmg android-signing-certificate.sha256 *mapping.txt > SHA256SUMS
      - name: Image identity
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: container
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          cp "docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          # shellcheck disable=SC2016
          printf '\n容器镜像：`%s:%s`\n\n镜像摘要：`%s`\n' "$IMAGE" "$RELEASE_TAG" "$IMAGE_DIGEST" >> "$RUNNER_TEMP/release-notes.md"
          PRERELEASE=()
          if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/release/* --repo "$GITHUB_REPOSITORY" --clobber
            DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$DRAFT" = true ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false --notes-file "$RUNNER_TEMP/release-notes.md" "${PRERELEASE[@]}"
            else
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
            fi
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "WildString / 野弦 ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" "${PRERELEASE[@]}"
          fi

  channels:
    name: Sync stable channels
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && !contains(inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-channels.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  summary:
    name: Release summary
    needs: [source, verify_android, publish, channels]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.source.outputs.run_android_emulator == 'true'
        continue-on-error: true
        with:
          pattern: android-test-reports-shard-*
          path: reports
      - name: Summarize release and retries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CHANNELS_RESULT: ${{ needs.channels.result }}
          HOMEBREW_RESULT: ${{ needs.channels.outputs.outcome || needs.channels.result }}
          RUN_ANDROID_EMULATOR: ${{ needs.source.outputs.run_android_emulator }}
          ANDROID_RESULT: ${{ needs.verify_android.result }}
        run: |
          {
            printf '## Release %s · attempt %s\n\n' "$RELEASE_TAG" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Core release · **%s**\n' "$PUBLISH_RESULT"
            printf -- '- Stable channels · **%s**\n' "$CHANNELS_RESULT"
            printf -- '- Homebrew sync · **%s**\n' "$HOMEBREW_RESULT"
            if [ "$PUBLISH_RESULT" = success ]; then
              printf -- '- [GitHub Release](%s/%s/releases/tag/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            fi
            if [ "$RUN_ANDROID_EMULATOR" = true ]; then
              printf -- '- Android device regression · **%s** · %s\n' "$ANDROID_RESULT" "$GITHUB_SHA"
            else
              printf -- '- Android device regression · skipped\n'
            fi

            printf '\n### Workflow jobs that failed on attempt 1\n\n'
            if failed_jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- [\(.name)](\(.html_url))"'); then
              printf '%s\n' "${failed_jobs:-None}"
            else
              printf 'First-attempt job results are unavailable.\n'
              echo "::warning title=Release summary incomplete::Could not read first-attempt job results." >&2
            fi

            if [ "$RUN_ANDROID_EMULATOR" = true ]; then
              printf '\n### Android device tests that failed on their first attempt\n\n'
              shopt -s nullglob
              reports=(reports/*/android-instrumented/shard-*/summary.json)
              if (( ${#reports[@]} == 0 )); then
                printf 'No shard reports are available.\n'
              else
                jq -sr '
                  add | group_by([.class, .iteration]) |
                  map(sort_by(.attempt) | select(first.attempt == 1 and (first.passed | not))) |
                  if length == 0 then "None in the available shard reports"
                  else .[] | "- `\(first.class)` (iteration \(first.iteration)) · \(
                    if last.passed then "passed on retry" else "failed" end
                  )" end
                ' "${reports[@]}"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
