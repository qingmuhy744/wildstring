name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify versions and main ancestry
        run: |
          python3 scripts/package_release.py --tag "$RELEASE_TAG" --check-only
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "docs/releases/$RELEASE_TAG.md"
          git merge-base --is-ancestor HEAD origin/main

  verify:
    uses: ./.github/workflows/ci.yml

  verify_android:
    uses: ./.github/workflows/android.yml

  android:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-37.0 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false
      - name: Build with the release signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/wildstring-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD", "ANDROID_SIGNING_CERT_SHA256"):
              if not os.environ.get(name):
                  raise SystemExit(f"Missing release signing secret: {name}")
          path = Path(os.environ["ANDROID_KEYSTORE_PATH"])
          path.touch(mode=0o600, exist_ok=False)
          path.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          PY
          make android-release
          ACTUAL=$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs artifacts/android-release/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL" = "$ANDROID_SIGNING_CERT_SHA256"
          printf '%s\n' "$ACTUAL" > artifacts/android-release/android-signing-certificate.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the signed, optimized APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: make android-release-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wildstring-android-release
          path: artifacts/android-release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload release device evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-smoke
          path: artifacts/android-release-smoke/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [source, verify, verify_android, android]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Build and package Web
        run: |
          npm --prefix frontend/web ci
          make build-web
          python3 scripts/package_release.py --tag "$RELEASE_TAG" --output-dir artifacts/release
          npm --prefix plugins/node-runtime ci --ignore-scripts
          node scripts/build_source_runtimes.mjs
          python3 scripts/package_source_plugins.py --output-dir artifacts/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wildstring-android-release
          path: artifacts/release
      - name: Verify APK and combine asset checksums
        working-directory: artifacts/release
        run: |
          sha256sum --check SHA256SUMS
          sha256sum -- *.apk *.zip android-signing-certificate.sha256 > SHA256SUMS
      - name: Image identity
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: container
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          cp "docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          # shellcheck disable=SC2016
          printf '\n容器镜像：`%s:%s`\n\n镜像摘要：`%s`\n' "$IMAGE" "$RELEASE_TAG" "$IMAGE_DIGEST" >> "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            PRERELEASE=()
            if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifacts/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "WildString / 野弦 ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" "${PRERELEASE[@]}"
          fi
