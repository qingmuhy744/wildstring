name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.18"
      - run: make setup
      - run: sudo apt-get update --error-on=any && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm --prefix frontend/web exec -- playwright install --with-deps chromium
      - run: make ci
      - name: Upload browser visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-visual-evidence
          path: |
            artifacts/*.png
            artifacts/browser-tests/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make docker-up docker-smoke docker-test
      - if: failure()
        run: make docker-logs LOG_ARGS='--tail=200'
      - if: always()
        run: make docker-down
