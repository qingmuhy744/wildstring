name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
      - run: make setup
      - name: Run code checks, source plugins and dependency audit
        run: |
          make check source-plugins dependency-audit
          uv lock --check --project backend

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-audio-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: apt-audio-${{ runner.os }}-
      - name: Install system dependencies for audio decoding
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
          if [ -d ~/.cache/apt-archives ] && [ -n "$(ls -A ~/.cache/apt-archives/*.deb 2>/dev/null)" ]; then
            sudo cp -n ~/.cache/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 --error-on=any
          sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
          mkdir -p ~/.cache/apt-archives
          sudo cp -n /var/cache/apt/archives/*.deb ~/.cache/apt-archives/ 2>/dev/null || true
      - name: Run backend pytest suite
        run: |
          uv sync --frozen --project backend --extra community-sources
          make test

  web:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
      - run: make setup
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-audio-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: apt-audio-${{ runner.os }}-
      - name: Install system dependencies for audio decoding
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
          if [ -d ~/.cache/apt-archives ] && [ -n "$(ls -A ~/.cache/apt-archives/*.deb 2>/dev/null)" ]; then
            sudo cp -n ~/.cache/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 --error-on=any
          sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
          mkdir -p ~/.cache/apt-archives
          sudo cp -n /var/cache/apt/archives/*.deb ~/.cache/apt-archives/ 2>/dev/null || true
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/web/package-lock.json') }}
      - run: npm --prefix frontend/web exec -- playwright install --with-deps chromium
      - name: Run Web tests and browser regressions
        run: make test-web test-large-web test-browse-web test-catalog-web test-transcoding-web
      - name: Upload browser visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-visual-evidence
          path: |
            artifacts/*.png
            artifacts/browser-tests/
            artifacts/*-verification/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container Smoke & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docker-up docker-smoke docker-test
      - if: failure()
        run: make docker-logs LOG_ARGS='--tail=200'
      - if: always()
        run: make docker-down
