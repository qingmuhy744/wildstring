name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides which expensive suites a pull request needs. Every other trigger (push to main,
    # release reuse, manual runs) runs the full core CI. Required checks report for every PR.
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      web: ${{ steps.areas.outputs.web }}
      container: ${{ steps.areas.outputs.container }}
      macos: ${{ steps.areas.outputs.macos }}
      ios: ${{ steps.areas.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/ci_changed_areas.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            printf 'backend=true\nweb=true\ncontainer=true\n' >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Static Checks & Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: make setup
      - name: Run code checks, source plugins and dependency audit
        run: |
          make check source-plugins dependency-audit
          uv lock --check --project backend

  backend:
    name: Backend Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Backend suite not needed for this change
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend, script or shared-input changes; the suite is skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.backend == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.backend == 'true'
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Read OS version
        id: os
        if: needs.changes.outputs.backend == 'true'
        run: |
          os_ver=$(. /etc/os-release && printf '%s' "${VERSION_ID:-unknown}")
          echo "version=$os_ver" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-audio-${{ runner.os }}-${{ steps.os.outputs.version }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: apt-audio-${{ runner.os }}-${{ steps.os.outputs.version }}-
      - name: Install system dependencies for audio decoding
        if: needs.changes.outputs.backend == 'true'
        run: scripts/install_audio_deps.sh
      - name: Run backend pytest suite
        if: needs.changes.outputs.backend == 'true'
        run: |
          uv sync --frozen --project backend --extra community-sources
          make test PYTEST_ARGS="-n auto"

  web_shard:
    name: Web E2E Shard (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Sync Python and Web dependencies
        run: |
          python3 scripts/setup.py
          uv sync --frozen --project backend --extra community-sources
          npm --prefix frontend/web ci
      - name: Read OS and Playwright versions
        id: meta
        run: |
          os_ver=$(. /etc/os-release && printf '%s' "${VERSION_ID:-unknown}")
          pw_ver=$(node -p "require('./frontend/web/package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "os_version=$os_ver" >> "$GITHUB_OUTPUT"
          echo "pw_version=$pw_ver" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-web-${{ runner.os }}-${{ steps.meta.outputs.os_version }}-${{ steps.meta.outputs.pw_version }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            apt-web-${{ runner.os }}-${{ steps.meta.outputs.os_version }}-${{ steps.meta.outputs.pw_version }}-
            apt-web-${{ runner.os }}-${{ steps.meta.outputs.os_version }}-
      - name: Install system dependencies for audio decoding
        run: scripts/install_audio_deps.sh
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.meta.outputs.os_version }}-${{ steps.meta.outputs.pw_version }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.meta.outputs.os_version }}-
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium and dependencies
        run: bash scripts/install_playwright_chromium.sh
      - name: Run Web E2E shard
        env:
          WEB_SHARD: ${{ matrix.shard }}
        run: python3 scripts/run_web_ci_shard.py --shard "$WEB_SHARD"
      - name: Upload shard visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-visual-shard-${{ matrix.shard }}
          path: |
            artifacts/*.png
            artifacts/browser-tests/
            artifacts/*-verification/
            artifacts/player-audit/
          if-no-files-found: ignore
          retention-days: 1

  web:
    name: Web E2E Tests
    needs: [changes, web_shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify change detection succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = "success"
      - name: Web suite not needed for this change
        if: needs.changes.outputs.web != 'true'
        run: echo "No Web, backend, script or shared-input changes; the browser suites are skipped."
      - name: Download shard visual evidence
        if: always() && needs.changes.outputs.web == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-visual-shard-*
          path: artifacts
          merge-multiple: true
      - name: Upload browser visual evidence
        id: visual
        if: always() && needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-visual-evidence
          path: |
            artifacts/*.png
            artifacts/browser-tests/
            artifacts/*-verification/
            artifacts/player-audit/
          if-no-files-found: ignore
          retention-days: 7
      - name: Link the screenshots in the job summary
        if: always() && needs.changes.outputs.web == 'true' && steps.visual.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.visual.outputs.artifact-url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          count=$([ -d artifacts ] && find artifacts -name '*.png' | wc -l | tr -d ' ' || echo 0)
          {
            echo "### Browser screenshots"
            echo
            echo "${count} screenshots (desktop and mobile, light and dark) for visual review: [browser-visual-evidence](${ARTIFACT_URL})"
            echo
            echo "Download: \`gh run download ${RUN_ID} -n browser-visual-evidence -D <empty-dir>\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require all Web E2E shards to pass
        if: always() && needs.changes.outputs.web == 'true'
        env:
          SHARD_RESULT: ${{ needs.web_shard.result }}
        run: |
          echo "web_shard result: $SHARD_RESULT"
          test "$SHARD_RESULT" = "success"

  container:
    name: Container Smoke & Test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Container checks not needed for this change
        if: needs.changes.outputs.container != 'true'
        run: echo "Container inputs are unchanged; the container checks are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.container == 'true'
        with:
          persist-credentials: false
      - name: Build, start and smoke-check the container
        if: needs.changes.outputs.container == 'true'
        run: make docker-up docker-smoke
      - name: Run the backend suite with the container FFmpeg
        if: needs.changes.outputs.backend == 'true'
        run: make docker-test SKIP_RUNTIME_BUILD=1
      - if: failure() && needs.changes.outputs.container == 'true'
        run: make docker-logs LOG_ARGS='--tail=200'
      - if: always() && needs.changes.outputs.container == 'true'
        run: make docker-down

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/macos.yml

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml

  quality_gate:
    name: Code Quality & Packaging
    needs: [quality, changes, macos, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify packaging and selected Apple jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_NEEDED: ${{ needs.changes.outputs.macos }}
          MACOS_RESULT: ${{ needs.macos.result }}
          IOS_NEEDED: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$CHANGES_RESULT" = success
          echo "macOS: $MACOS_RESULT; iOS: $IOS_RESULT"
          if [ "$MACOS_NEEDED" = true ]; then test "$MACOS_RESULT" = success; fi
          if [ "$IOS_NEEDED" = true ]; then test "$IOS_RESULT" = success; fi
