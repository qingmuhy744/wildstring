name: Android dependency graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: Submit Android dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-36.1 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          build-root-directory: frontend/android
          additional-arguments: --no-daemon --no-configuration-cache
          dependency-graph: generate-submit-and-upload
          artifact-retention-days: 14
