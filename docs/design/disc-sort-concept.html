<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>野弦 · 分碟与排序概念</title>
<style>
:root{color-scheme:dark;--bg:#191a17;--surface:#22231f;--fg:#eeeee5;--muted:#999c90;--line:#30322b;--accent:#c8d4ae}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;font-size:14px}button{color:inherit;font:inherit;cursor:pointer;border:0;background:none}header{padding:20px 22px 8px;display:flex;align-items:center;gap:16px}header .back{font-size:26px}header strong{font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.dots{font-size:24px;color:var(--muted)}main{padding:0 22px 140px;max-width:900px;margin:auto}.album{display:flex;align-items:center;gap:18px;margin:16px 0 22px}.art{height:96px;width:96px;flex-shrink:0;border-radius:7px;overflow:hidden;background:#aac7c8;position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px;transform:rotate(-2deg)}.tile{background:linear-gradient(145deg,#d7ddcd,#688b87);display:flex;align-items:center;justify-content:center;font-size:26px;color:#f1f0df}.tile:nth-child(2n){background:linear-gradient(145deg,#4c6e70,#d5dcbd)}.art span{position:absolute;bottom:5px;left:5px;right:5px;text-align:center;font-size:8px;letter-spacing:.12em;background:#9fc9c9e0;color:#163637;padding:3px}.info .eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted)}h1{font-size:23px;margin:8px 0;line-height:1.3;letter-spacing:-.04em}.info p{font-size:12px;margin:8px 0;color:var(--muted);line-height:1.7}.toolbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;gap:12px}.playall{background:var(--accent);color:#20271b;padding:10px 17px;border-radius:24px;font-size:13px;font-weight:600}.sort{display:flex;align-items:center;gap:8px;font-size:12px;color:#b8bcae}.sort button{font-size:12px;color:#b8bcae}.disc{display:flex;align-items:center;gap:9px;margin:22px 0 6px;height:24px;color:var(--muted)}.disc .name{font-size:11px;font-weight:600;letter-spacing:.1em;white-space:nowrap}.disc .count{font-size:10px;white-space:nowrap;color:#777d6e}.disc .line{height:1px;background:var(--line);flex:1;margin-left:2px}.song{display:flex;align-items:center;gap:14px;min-height:62px;padding:7px 10px 7px 0;border-radius:7px}.song .number{width:23px;text-align:center;font-size:11px;color:#777e6f;font-variant-numeric:tabular-nums}.song .identity{flex:1;min-width:0}.title{font-size:15px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:var(--muted);font-size:11px;margin-top:3px}.song time{color:#777e6f;font-size:11px;font-variant-numeric:tabular-nums}.more{font-size:21px;padding:4px 0 4px 12px;color:#999e90}.current{background:#c8d4ae09}.current .title{color:var(--accent)}.equalizer{display:flex;justify-content:center;align-items:center;gap:2px;height:18px}.equalizer i{background:var(--accent);width:2px;border-radius:2px;height:10px}.equalizer i:nth-child(2){height:17px}.equalizer i:nth-child(3){height:7px}.player{position:fixed;bottom:25px;left:22px;right:22px;border-radius:32px;padding:9px 16px 9px 9px;background:#384b49;display:flex;align-items:center;gap:12px;max-width:856px;margin:auto;box-shadow:0 8px 25px #0002}.smallart{height:38px;width:38px;border-radius:50%;background:linear-gradient(25deg,#77837a,#ccd5bb);display:grid;place-items:center;color:#26443e;font-size:11px;letter-spacing:.08em}.player .identity{flex:1}.player .title{font-size:13px}.player .artist{font-size:10px;color:#bdc9bc;margin-top:2px}.player button{font-size:19px;margin-left:10px}.safe{position:fixed;bottom:7px;width:110px;height:3px;background:#55574f;border-radius:9px;left:calc(50% - 55px)}.caption{font-size:11px;color:#959d88;margin:18px 0 2px;display:flex;gap:7px;align-items:center}.caption span{color:var(--accent)}.menu{position:fixed;right:22px;top:240px;border-radius:12px;border:1px solid #404438;background:#282b23;box-shadow:0 12px 40px #0008;padding:7px;z-index:2;min-width:168px}.menu button{display:block;text-align:left;width:100%;padding:9px 12px;font-size:12px;color:#d8dccf;border-radius:6px}.menu button.active{background:#c8d4ae15;color:var(--accent)}[hidden]{display:none!important}@media(min-width:700px){header{max-width:944px;margin:auto;padding-top:28px}main{padding-top:5px}.album{margin-bottom:30px}.art{height:128px;width:128px}.info h1{font-size:28px}.song{min-height:65px}.disc{margin-top:26px}.player{bottom:25px}.menu{right:calc((100vw - min(856px,100vw - 44px))/2);top:280px}.title{font-size:16px}}
</style>
<header><button class="back" aria-label="返回">‹</button><strong>步步自选作品辑</strong><button class="dots" aria-label="更多">⋮</button></header>
<main><div class="album"><div class="art" aria-hidden="true"><div class="tile">步</div><div class="tile">步</div><div class="tile">五</div><div class="tile">月</div><div class="tile">天</div><div class="tile">♪</div><span>THE BEST OF 1999–2013</span></div><div class="info"><div class="eyebrow">MAYDAY · ALBUM</div><h1>步步自选作品辑</h1><p>The Best of 1999–2013（一路有你版）<br>五月天 · 2 张碟 · 28 首</p></div></div>
<div class="toolbar"><button class="playall">▶&nbsp; 播放全部</button><div class="sort"><button id="sort" aria-expanded="false">碟号与曲序 ⌄</button><button id="order" aria-label="切换排序方向">↑</button></div></div>
<div id="songs"></div><div class="caption"><span>↳</span> 分碟只做视觉分组，整张专辑连续播放</div></main>
<div id="menu" class="menu" hidden></div>
<div class="player"><div class="smallart">步步</div><div class="identity"><div class="title">温柔-2000</div><div class="artist">五月天</div></div><button aria-label="暂停">Ⅱ</button><button aria-label="播放队列">☷</button></div><div class="safe"></div>
<script>
const data=[{disc:1,number:12,title:'我不愿让你一个人-2011',duration:'4:24'},{disc:1,number:13,title:'知足-2005',duration:'4:16'},{disc:1,number:14,title:'温柔-2000',duration:'4:30'},{disc:2,number:1,title:'你是唯一-2010',duration:'3:39'},{disc:2,number:2,title:'夜访吸血鬼-2008',duration:'4:09'},{disc:2,number:3,title:'如烟-2008',duration:'5:20'},{disc:2,number:4,title:'一颗苹果-2001',duration:'3:32'}];
let sorting='碟号与曲序',desc=false;const menu=document.querySelector('#menu');['碟号与曲序','歌曲名称','入库时间','歌曲时长','播放次数','最近听过'].forEach(label=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{sorting=label;document.querySelector('#sort').textContent=label+' ⌄';menu.hidden=true;document.querySelector('#sort').setAttribute('aria-expanded','false');render()};menu.append(b)});
function render(){const rows=[...data];if(sorting==='歌曲名称')rows.sort((a,b)=>a.title.localeCompare(b.title,'zh'));if(desc)rows.reverse();let previous=null;document.querySelector('#songs').innerHTML=rows.map(t=>{const heading=sorting==='碟号与曲序'&&previous!==t.disc?`<div class="disc"><span class="name">DISC ${String(t.disc).padStart(2,'0')}</span><span class="count">14 首</span><span class="line"></span></div>`:'';previous=t.disc;return heading+`<div class="song ${t.title==='温柔-2000'?'current':''}"><span class="number">${t.title==='温柔-2000'?'<span class="equalizer"><i></i><i></i><i></i></span>':String(t.number).padStart(2,'0')}</span><div class="identity"><div class="title">${t.title}</div><div class="artist">${sorting==='碟号与曲序'?'':'Disc '+t.disc+' · '}五月天</div></div><time>${t.duration}</time><button class="more" aria-label="歌曲操作">⋮</button></div>`}).join('');[...menu.children].forEach(b=>b.classList.toggle('active',b.textContent===sorting))}render();document.querySelector('#sort').onclick=()=>{menu.hidden=!menu.hidden;document.querySelector('#sort').setAttribute('aria-expanded',String(!menu.hidden))};document.querySelector('#order').onclick=e=>{desc=!desc;e.target.textContent=desc?'↓':'↑';render()};
</script></html>
