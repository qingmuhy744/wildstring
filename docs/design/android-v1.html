<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>野弦 Android · 第一版交互草图</title>
  <style>

    .tablet.medium .nav button[aria-current="page"], .tablet.wide .nav button[aria-current="page"] { background: #e98a6d15; }
    .tablet.medium .gesture, .tablet.wide .gesture { grid-column: 1 / -1; grid-row: 4; margin: 6px auto; }

    @media (max-width: 360px) { .phone { padding: 0 11px; border-radius: 24px; } .screen { min-height: 493px; } .hero { margin-bottom: 20px; } .player { min-height: 606px; } .chip { padding: 9px 13px; } }

<body>
  <div class="intro"><div><h1>野弦 · Android 第一版</h1><p>交互草图 · 示例曲库 · 无音频、无服务连接</p></div><div class="preview-controls"><div class="device-switch" aria-label="预览设备"><button data-device="phone" aria-pressed="true">手机</button><button data-device="tablet" aria-pressed="false">平板</button></div><span class="draft">设计阶段 / A0</span></div></div>
  <div class="stage" id="stage">
    <div class="phone" id="prototype">
      <div class="status" aria-hidden="true"><span>9:41</span><span>▰ ▰ ▱</span></div>
      <main id="content" class="screen"></main>
      <div id="mini" class="mini"></div>
      <nav class="nav" id="navigation" aria-label="主导航"></nav>
      <div class="gesture" aria-hidden="true"></div>
      <section id="sheet" class="sheet" aria-label="播放面板" hidden></section>
    </div>
    <aside class="notes">
      <span class="kicker">WILDSTRING / ANDROID</span>
      <h2>带着自己的曲库，<br>从这里继续听。</h2>
      <p>延续网页端的深灰与珊瑚橙，保留音乐和封面的空间。先把每天会用的播放体验做好。</p>
      <ol><li><strong>手机 · 全屏看歌词</strong>点击封面或“歌词”进入整页歌词，返回封面时保留进度和播放状态。</li><li><strong>平板 · 封面与歌词并排</strong>宽窗采用侧边导航、多列专辑和双栏播放；分屏时按可用宽度收拢。</li><li><strong>同一份播放状态</strong>切换设备预览、歌词、队列与导航，保留当前曲目、暂停状态和位置。</li></ol>
    </aside>
  </div>
  <script>
    (() => {
      const root = document.getElementById('prototype');
      const stage = document.getElementById('stage');
      const content = document.getElementById('content');
      const mini = document.getElementById('mini');
      const nav = document.getElementById('navigation');
      const sheet = document.getElementById('sheet');
      const tracks = [
        { id: 'demo-1', title: '山风经过', artist: '远山来信', album: '山野之间', cover: '', mark: '山野', length: 228 },
        { id: 'demo-2', title: '晚潮', artist: '蓝色房间', album: '海岸线', cover: 'b', mark: '海岸', length: 256 },
        { id: 'demo-3', title: '归途的灯', artist: '远山来信', album: '山野之间', cover: '', mark: '山野', length: 204 },
        { id: 'demo-4', title: '日落之后', artist: '橘色电台', album: '日落之后', cover: 'c', mark: '日落', length: 240 },
        { id: 'demo-5', title: '穿过旧街', artist: '失眠列车', album: '午夜来信', cover: 'd', mark: '午夜', length: 216 }
      ];
      const lyricLines = [
        { at: 0, text: '山风从这里经过' },
        { at: 30, text: '吹散了城市的灯火' },
        { at: 67, text: '带着昨日的回声', sub: '把时间轻轻唱给你听' },
        { at: 105, text: '下一程，慢慢听' },
        { at: 145, text: '在每一次日落以后' },
        { at: 190, text: '有音乐陪你往前走' }
      ];
      const paths = {
        library: '<path d="M4 5h4v15H4zM10 5h4v15h-4zM17 4l4 15-3 1-4-15z"/>',
        search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
        mine: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
        settings: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',
        play: '<path d="m8 5 11 7-11 7z"/>', pause: '<path d="M8 5v14M16 5v14"/>',
        next: '<path d="m5 5 10 7-10 7zM19 5v14"/>', previous: '<path d="m19 5-10 7 10 7zM5 5v14"/>',
        heart: '<path d="M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1c-4 4 2 10 8 14 6-4 12-10 8-14Z"/>',
        queue: '<path d="M3 6h16M3 12h12M3 18h8M19 15v6m-3-3h6"/>',
        repeat: '<path d="m16 2 4 4-4 4M20 6H6a3 3 0 0 0-3 3m5 13-4-4 4-4M4 18h14a3 3 0 0 0 3-3"/>',
        close: '<path d="m6 6 12 12M18 6 6 18"/>'
      };
      const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
      const art = (t, cls = '') => `<span class="art ${t.cover} ${cls}" aria-hidden="true"><i>${t.mark}</i></span>`;
      const allIds = () => tracks.map((_, i) => i);
      let entryCount = tracks.length;
      let queue = allIds().map(i => ({ entry: `q-${i}`, track: i }));
      let current = 0, currentEntry = 'q-0', playing = false, section = 'library', filter = 'albums', position = 67, mode = 0;
      let returnSection = 'library', device = 'phone', size = 'compact', playerView = 'cover', tabletPanel = 'lyrics', following = true;
      let collectionTitle = '', collectionIds = [], query = '';
      const loved = new Set([1]);
      const time = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
      const wide = () => device === 'tablet' && size === 'wide';
      const rows = ids => ids.map(i => `<div class="row"><button class="row-main" data-track="${i}" aria-label="播放 ${tracks[i].title}">${art(tracks[i], 'thumb')}<span class="row-text"><strong>${tracks[i].title}</strong><small>${tracks[i].artist} · ${tracks[i].album}</small></span></button><button class="icon" data-add="${i}" aria-label="将 ${tracks[i].title} 加入队列">${icon('queue')}</button></div>`).join('');
      const header = (title, brand = false) => `<header><div><h2>${title}</h2>${brand ? '<small>WILDSTRING</small>' : ''}</div><button class="icon" data-action="settings" aria-label="设置">${icon('settings')}</button></header>`;
      function queueItems() {
        return queue.map(item => `<div class="row"><button class="row-main" data-track="${item.track}" data-entry="${item.entry}" aria-label="播放队列中的 ${tracks[item.track].title}">${art(tracks[item.track], 'thumb')}<span class="row-text"><strong>${tracks[item.track].title}${item.entry === currentEntry ? ' · 当前' : ''}</strong><small>${tracks[item.track].artist}</small></span></button><button class="icon" data-remove="${item.entry}" aria-label="移除 ${tracks[item.track].title}" ${item.entry === currentEntry ? 'disabled title="当前播放项"' : ''}>${icon('close')}</button></div>`).join('') || '<p class="hint">队列为空。</p>';
      }
      function lyricsMarkup() {
        let active = 0;
        lyricLines.forEach((line, i) => { if (line.at <= position) active = i; });
        return `<section class="lyrics-content" aria-label="全屏歌词"><div class="lyrics-scroll" aria-label="歌词滚动区域">${lyricLines.map((line, i) => `<button class="lyric-line ${i === active ? 'current' : ''}" data-seek="${line.at}" ${i === active ? 'aria-current="true"' : ''} aria-label="跳到 ${time(line.at)} ${line.text}">${line.text}${line.sub ? `<small>${line.sub}</small>` : ''}</button>`).join('')}</div><div class="lyrics-footer">${following ? '<span class="lyrics-label">原创示例歌词</span>' : '<button class="follow" data-action="follow">回到当前歌词</button>'}</div></section>`;
      }
      function syncLyrics() {
        if (!following) return;
        const scroll = content.querySelector('.lyrics-scroll');
        const active = scroll?.querySelector('.current');
        if (scroll && active) scroll.scrollTop = active.offsetTop - scroll.offsetTop - scroll.clientHeight / 2 + active.clientHeight / 2;
      }
      function playbackControls() {
        const t = tracks[current];
        return `<div class="track-heading"><div><h3>${t.title}</h3><p>${t.artist}</p></div><button class="icon favorite ${loved.has(current) ? 'active' : ''}" data-action="favorite" aria-label="${loved.has(current) ? '取消收藏' : '收藏'}" aria-pressed="${loved.has(current)}">${icon('heart')}</button></div><input class="seek" id="seek" type="range" min="0" max="${t.length}" value="${position}" aria-label="播放进度"><div class="times"><span id="position">${time(position)}</span><span>${time(t.length)}</span></div><div class="transport"><button class="icon" data-action="mode" aria-label="切换播放模式">${icon('repeat')}</button><button class="icon" data-action="previous" aria-label="上一首">${icon('previous')}</button><button class="icon play" data-action="toggle" aria-label="${playing ? '暂停' : '继续播放'}">${icon(playing ? 'pause' : 'play')}</button><button class="icon" data-action="next" aria-label="下一首">${icon('next')}</button><button class="icon" data-action="queue" aria-label="播放队列">${icon('queue')}</button></div><div class="player-actions"><button data-action="${playerView === 'lyrics' ? 'cover' : 'lyrics'}">${playerView === 'lyrics' ? '返回封面' : '歌词'}</button><button data-action="queue">队列 · ${queue.length}</button></div><div class="notice" aria-live="polite">${['顺序播放', '单曲循环', '随机播放'][mode]} · 交互演示，无音频</div>`;
      }
      function renderChrome() {
        const t = tracks[current], full = section === 'player';
        root.classList.toggle('in-player', full);
        root.classList.toggle('in-lyrics', full && (playerView === 'lyrics' || wide()));
        mini.hidden = full;
        nav.hidden = full;
        mini.innerHTML = `<button class="row-main" data-action="expand" aria-label="展开正在播放">${art(t, 'thumb')}<span class="row-text"><strong>${t.title}</strong><small>${t.artist}</small></span></button><button class="icon" data-action="toggle" aria-label="${playing ? '暂停' : '继续播放'}">${icon(playing ? 'pause' : 'play')}</button>`;
        nav.innerHTML = [['library', '曲库'], ['search', '找歌'], ['mine', '我的']].map(([id, label]) => `<button data-nav="${id}" ${section === id ? 'aria-current="page"' : ''}>${icon(id)}<span>${label}</span></button>`).join('');
      }
      function render() {
        content.className = section === 'player' ? 'player' : 'screen';
        if (section === 'library') {
          const albums = device === 'tablet' && size !== 'compact' ? [0, 1, 3, 4] : [0, 1];
          content.innerHTML = `${header('野弦', true)}<p class="tagline">让收藏有新的回响。</p><div class="filters">${[['albums', '专辑'], ['tracks', '歌曲'], ['artists', '艺人']].map(([id, label]) => `<button class="chip" data-filter="${id}" aria-pressed="${filter === id}">${label}</button>`).join('')}</div><div class="section-title"><h3>${filter === 'albums' ? '最近加入' : filter === 'tracks' ? '全部歌曲' : '曲库中的艺人'}</h3><span>示例曲库</span></div>${filter === 'albums' ? `<div class="albums">${albums.map(i => `<button class="album" data-album="${i}">${art(tracks[i])}<strong>${tracks[i].album}</strong><small>${tracks[i].artist}</small></button>`).join('')}</div><div class="section-title"><h3>继续发现</h3><span>从自己的收藏出发</span></div><div class="library-lower">${rows([2, 3])}</div>` : filter === 'tracks' ? rows(allIds()) : [0, 1, 3, 4].map(i => `<button class="list-entry" data-artist="${i}">${tracks[i].artist}<span>查看歌曲 ›</span></button>`).join('')}`;
        } else if (section === 'search') {
          content.innerHTML = `${header('找歌')}<label for="query" class="hint">搜索你的曲库</label><input class="search" id="query" type="search" placeholder="歌曲、艺人或专辑" autocomplete="off"><div class="filters"><button class="chip" aria-pressed="true">关键词</button><button class="chip" disabled title="等待服务端 Agent 接口">AI 找歌 · 待后端</button></div><div id="results"></div><p class="hint">仅搜索这份示例曲库。</p>`;
          document.getElementById('query').value = query;
          renderSearchResults();
        } else if (section === 'mine') {
          content.innerHTML = `${header('我的')}<p class="tagline">音乐有了自己的去处。</p><button class="list-entry" data-action="favorites">♥ 我喜欢<span>${loved.size} 首 ›</span></button><button class="list-entry" data-action="playlist">傍晚散步<span>示例歌单 · 3 首 ›</span></button><button class="list-entry" data-action="recent">最近听过<span>查看 ›</span></button><div class="section-title"><h3>这个版本先做好</h3></div><p class="hint">连接私有曲库、后台播放、歌词、收藏和歌单。离线下载与手机管理曲库后续独立交付。</p>`;
        } else if (section === 'player') {
          const t = tracks[current];
          const isLyrics = playerView === 'lyrics' && !wide();
          content.innerHTML = `<header><button class="back" data-action="${isLyrics ? 'cover' : 'collapse'}" aria-label="${isLyrics ? '返回封面' : '收起播放器'}">${isLyrics ? '‹' : '⌄'}</button><span>正在播放 · ${t.album}</span><button class="icon" data-action="queue" aria-label="打开队列">${icon('queue')}</button></header><div class="player-body"><div class="playback-pane">${isLyrics ? lyricsMarkup() : `<button class="cover-trigger" data-action="lyrics" aria-label="查看全屏歌词">${art(t, 'hero')}</button>`}${playbackControls()}</div><div class="side-pane"><div class="pane-tabs"><button data-panel="lyrics" aria-pressed="${tabletPanel === 'lyrics'}">歌词</button><button data-panel="queue" aria-pressed="${tabletPanel === 'queue'}">队列 · ${queue.length}</button><small>${t.artist}</small></div>${tabletPanel === 'lyrics' ? lyricsMarkup() : `<div class="queue-list">${queueItems()}</div>`}</div></div>`;
          requestAnimationFrame(syncLyrics);
        } else if (section === 'settings') {
          content.innerHTML = `<header><button class="back" data-action="back" aria-label="返回">‹</button><h2>连接服务器</h2><span></span></header><p class="hint">连接页草图。实际应用连接已有野弦实例，首次管理员设置在服务端完成。</p><label class="hint" for="server">服务器地址</label><input id="server" class="search" type="url" value="https://music.example.com" disabled><p class="hint">HTTPS 优先。局域网 HTTP 需明确启用；会话、音频和封面共用认证。</p><button class="primary" data-action="back">返回示例曲库</button><p class="hint">这里不会发出请求或保存真实凭据。</p>`;
        } else if (section === 'collection') {
          content.innerHTML = `<header><button class="back" data-action="back" aria-label="返回">‹</button><h2>${collectionTitle}</h2><span></span></header>${collectionIds.length ? rows(collectionIds) : '<p class="hint">还没有收藏。在播放页点一下心形试试。</p>'}`;
        } else if (section === 'detail') {
          const t = tracks[collectionIds[0]];
          content.innerHTML = `<header><button class="back" data-action="back" aria-label="返回">‹</button><span>专辑</span><span></span></header><div class="detail-title">${art(t)}<h3>${t.album}</h3><p>${t.artist} · 示例专辑</p><button class="primary" data-action="play-album">播放全部</button></div><div class="section-title"><h3>歌曲</h3></div>${rows(collectionIds)}`;
        }
        renderChrome();
      }
      function renderSearchResults() {
        const ids = allIds().filter(i => `${tracks[i].title} ${tracks[i].artist} ${tracks[i].album}`.includes(query.trim()));
        document.getElementById('results').innerHTML = ids.length ? rows(ids) : '<p class="hint" role="status">这份示例曲库里没有匹配的歌曲。</p>';
      }
      function showCollection(title, ids) { collectionTitle = title; collectionIds = ids; section = 'collection'; render(); }
      function openQueue() {
        tabletPanel = 'queue';
        if (wide()) { render(); return; }
        sheet.hidden = false;
        sheet.innerHTML = `<div class="sheet-handle" aria-hidden="true"></div><header><h3>播放队列 · ${queue.length}</h3><button class="icon" data-action="close" aria-label="关闭面板">${icon('close')}</button></header>${queueItems()}`;
        sheet.querySelector('button')?.focus();
      }
      function playTrack(i, entry) {
        current = i;
        const item = entry ? queue.find(x => x.entry === entry) : queue.find(x => x.track === i);
        if (item) currentEntry = item.entry;
        else { currentEntry = `q-${entryCount++}`; queue.push({ track: i, entry: currentEntry }); }
        position = 0; playing = true; following = true;
        if (section !== 'player') returnSection = ['library', 'search', 'mine'].includes(section) ? section : 'library';
        section = 'player'; sheet.hidden = true; render();
      }
      root.addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b || b.disabled) return;
        if (b.dataset.nav) { section = b.dataset.nav; sheet.hidden = true; render(); }
        else if (b.dataset.filter) { filter = b.dataset.filter; render(); }
        else if (b.dataset.panel) { tabletPanel = b.dataset.panel; render(); }
        else if (b.dataset.track !== undefined) playTrack(Number(b.dataset.track), b.dataset.entry);
        else if (b.dataset.add !== undefined) { queue.push({ track: Number(b.dataset.add), entry: `q-${entryCount++}` }); b.setAttribute('aria-label', '已加入队列'); b.innerHTML = '✓'; }
        else if (b.dataset.remove !== undefined) { queue = queue.filter(x => x.entry !== b.dataset.remove); render(); if (!sheet.hidden) openQueue(); }
        else if (b.dataset.album !== undefined) { collectionIds = allIds().filter(i => tracks[i].album === tracks[Number(b.dataset.album)].album); section = 'detail'; render(); }
        else if (b.dataset.artist !== undefined) { const t = tracks[Number(b.dataset.artist)]; showCollection(t.artist, allIds().filter(i => tracks[i].artist === t.artist)); }
        else if (b.dataset.seek !== undefined) { position = Math.min(Number(b.dataset.seek), tracks[current].length); following = true; render(); }
        else if (b.dataset.action) {
          const a = b.dataset.action;
          if (a === 'toggle') { playing = !playing; render(); }
          if (a === 'expand') { returnSection = ['library', 'search', 'mine'].includes(section) ? section : 'library'; section = 'player'; render(); }
          if (a === 'collapse') { section = returnSection; render(); }
          if (a === 'cover') { playerView = 'cover'; render(); }
          if (a === 'lyrics') { playerView = 'lyrics'; tabletPanel = 'lyrics'; following = true; render(); }
          if (a === 'settings') { section = 'settings'; render(); }
          if (a === 'back') { section = 'library'; render(); }
          if (a === 'favorite') { if (loved.has(current)) loved.delete(current); else loved.add(current); render(); }
          if (a === 'next' || a === 'previous') {
            const index = queue.findIndex(x => x.entry === currentEntry);
            const next = mode === 2 && queue.length > 1 ? (index + 1 + Math.floor(Math.random() * (queue.length - 1))) % queue.length : (index + (a === 'next' ? 1 : -1) + queue.length) % queue.length;
            if (queue[next]) { current = queue[next].track; currentEntry = queue[next].entry; }
            position = 0; following = true; render();
          }
          if (a === 'mode') { mode = (mode + 1) % 3; render(); }
          if (a === 'queue') openQueue();
          if (a === 'close') { sheet.hidden = true; content.querySelector('[data-action="queue"]')?.focus(); }
          if (a === 'favorites') showCollection('我喜欢', [...loved]);
          if (a === 'playlist') showCollection('傍晚散步', [0, 1, 3]);
          if (a === 'recent') showCollection('最近听过', [current]);
          if (a === 'follow') { following = true; render(); }
          if (a === 'play-album') { queue = collectionIds.map(i => ({ track: i, entry: `q-${entryCount++}` })); playTrack(queue[0].track, queue[0].entry); }
        }
      });
      root.addEventListener('input', e => {
        if (e.target.id === 'query') { query = e.target.value; renderSearchResults(); }
        if (e.target.id === 'seek') {
          position = Number(e.target.value); document.getElementById('position').textContent = time(position);
          content.querySelectorAll('.lyrics-content').forEach(view => { view.outerHTML = lyricsMarkup(); });
          syncLyrics();
        }
      });
      function stopFollowing(e) {
        const scroll = e.target.closest('.lyrics-scroll');
        if (!scroll || !following) return;
        following = false;
        const footer = scroll.parentElement.querySelector('.lyrics-footer');
        footer.innerHTML = '<button class="follow" data-action="follow">回到当前歌词</button>';
      }
      root.addEventListener('wheel', stopFollowing, { passive: true });
      root.addEventListener('touchmove', stopFollowing, { passive: true });
      root.addEventListener('keydown', e => {
        if (e.target.closest('.lyrics-scroll') && ['PageDown', 'PageUp', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) stopFollowing(e);
        if (e.key !== 'Escape') return;
        if (!sheet.hidden) { sheet.hidden = true; content.querySelector('[data-action="queue"]')?.focus(); }
        else if (section === 'player' && playerView === 'lyrics' && !wide()) { playerView = 'cover'; render(); }
        else if (section === 'player') { section = returnSection; render(); }
      });
      function updateSize() {
        const width = root.getBoundingClientRect().width;
        const short = window.innerHeight - document.querySelector('.intro').getBoundingClientRect().height - 64 < 480;
        const nextSize = device === 'phone' ? 'compact' : width >= 840 && !short ? 'wide' : width >= 600 ? 'medium' : 'compact';
        root.classList.toggle('tablet', device === 'tablet');
        root.classList.toggle('short', short);
        root.classList.toggle('medium', nextSize === 'medium');
        root.classList.toggle('wide', nextSize === 'wide');
        if (size !== nextSize) {
          const keepQueue = section === 'player' && (!sheet.hidden || (size === 'wide' && tabletPanel === 'queue'));
          if (section === 'player' && size === 'wide' && nextSize !== 'wide' && tabletPanel === 'lyrics') playerView = 'lyrics';
          size = nextSize; sheet.hidden = true; render();
          if (keepQueue) openQueue();
        }
      }
      document.querySelectorAll('[data-device]').forEach(b => b.addEventListener('click', () => {
        device = b.dataset.device;
        stage.classList.toggle('tablet', device === 'tablet');
        document.querySelectorAll('[data-device]').forEach(button => button.setAttribute('aria-pressed', String(button === b)));
        updateSize(); render();
      }));
      new ResizeObserver(updateSize).observe(root);
      window.addEventListener('resize', updateSize);
      render();
    })();
  </script>
</body>
</html>
